[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tico"
version = "0.1.0"
description = "Thinking with Images without Coordinates"
authors = [{ name = "TiCO team" }]
requires-python = ">=3.10,<3.13"
license = "MIT"

dependencies = [
    "pre-commit>=3.7.1",
    "pip>=24.1.1",
    "Pillow>=10.4.0",
    "liger-kernel==0.5.2",
    "opencv-python-headless>=4.10.0.84",
    "accelerate==1.1.1",
    "qwen-vl-utils==0.0.8",
    "deepspeed==0.16.0",
    "transformers==4.51.3",
    "flash-attn==2.7.3",
    "wandb==0.18.3",
    "datasets>=2.18.0",
    "math-verify==0.8.0",
    "trl==0.14.0",
    "matplotlib",
    "rouge_score"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.1",
    "pytest>=8.2.2",
]

[tool.pdm]
distribution = false

[tool.setuptools]
package-dir = { "" = "sft" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["sft"]
include = ["tico*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PGH",
    "Q",
    "SIM",
    "TRY",
    "UP",
    "W",
    "YTT",
]

exclude = [
    "migrations",
    "__pycache__",
    "manage.py",
    "settings.py",
    "env",
    ".env",
    "venv",
    ".venv",
]

ignore = [
    "B905",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D401",
    "E402",
    "E501",
    "TRY003",
    "N812",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["chr", "typer.Argument", "typer.Option"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "S101",
    "S102",
    "S106",
    "PGH001",
]

[tool.ruff.lint.pep8-naming]
staticmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]